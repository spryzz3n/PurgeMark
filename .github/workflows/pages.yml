name: site

# Publishes site/ to GitHub Pages. The verifier script and screenshots are
# copied in from verifier/ and docs/images/ so they only exist once in the repo.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "verifier/zt-verify.js"
      - "docs/images/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p public
          cp -r site/. public/
          cp verifier/zt-verify.js public/verify/
          mkdir -p public/images
          cp docs/images/*.png public/images/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
