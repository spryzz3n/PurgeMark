name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libssl-dev nlohmann-json3-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verifier cross-implementation test
        run: node verifier/test.js
